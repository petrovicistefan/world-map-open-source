<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Map Open Source — Berlin bus lines</title>
    <meta
      name="description"
      content="BVG Bus 100, 200 and M41 with real stops and GTFS shapes — simulated street motion on MapLibre + OpenFreeMap."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside class="panel" id="panel">
      <header class="panel-head">
        <h1>Berlin buses</h1>
        <p class="panel-sub">
          BVG 100 · 200 · M41 — real stops + GTFS shapes
        </p>
      </header>

      <div class="panel-section">
        <div class="section-label">Lines</div>
        <div class="route-list" id="route-list" role="group" aria-label="Bus lines"></div>
      </div>

      <div class="panel-section controls">
        <label class="toggle">
          <input type="checkbox" id="toggle-vehicles" checked />
          <span>Moving buses</span>
        </label>
        <label class="speed">
          <span>~22 km/h</span>
          <input
            type="range"
            id="speed"
            min="0.5"
            max="3"
            step="0.25"
            value="1"
            aria-label="Speed multiplier on street pace"
          />
          <span class="speed-val" id="speed-val">1×</span>
        </label>
      </div>

      <p class="panel-note">
        Static GTFS routes. Buses run both directions; at the terminus they
        start the same way again. ~22 km/h · zoom 12–16.
      </p>

      <nav class="panel-nav">
        <a href="../train-demo/">Berlin trains</a>
        <a href="../demo/">Pins demo</a>
        <a href="../docs/">Docs</a>
      </nav>
    </aside>

    <p class="status" id="status">Loading lines…</p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
