<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Map Open Source — Demo</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="panel">
      <h1>World Map OS</h1>
      <p class="tagline">OpenFreeMap base · curated overlays</p>
      <fieldset>
        <legend>Layers</legend>
        <label><input type="checkbox" data-layer="places" checked /> places</label>
        <label><input type="checkbox" data-layer="nature" checked /> nature</label>
        <label><input type="checkbox" data-layer="transport" checked /> transport</label>
        <label><input type="checkbox" data-layer="culture" checked /> culture</label>
        <label><input type="checkbox" data-layer="community" checked /> community</label>
      </fieldset>
      <p class="hint">Samples: Bucharest. Serve this folder via a local static server so GeoJSON can load.</p>
    </aside>
    <div id="map"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
