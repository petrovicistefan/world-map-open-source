<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Map Open Source — Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside class="results" id="results" data-expanded="true">
      <button type="button" class="results-toggle" id="results-toggle" aria-expanded="true">
        <span class="results-title" id="results-title">Results</span>
        <span class="results-count" id="results-count">0</span>
        <span class="results-chevron" aria-hidden="true"></span>
      </button>
      <div class="results-search" id="results-search">
        <input
          type="search"
          id="search-input"
          placeholder="Search visible results"
          autocomplete="off"
          enterkeyhint="search"
        />
        <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search">
          Clear
        </button>
      </div>
      <div class="results-body" id="results-body">
        <ul class="results-list" id="results-list"></ul>
      </div>
      <nav class="results-nav">
        <a href="../docs/">Docs</a>
        <a href="https://github.com/petrovicistefan/world-map-open-source">GitHub</a>
      </nav>
    </aside>

    <header class="top-bar">
      <div class="chips" id="chips" role="toolbar" aria-label="Map layers"></div>
    </header>

    <p class="filter-hint" id="filter-hint">Showing all layers</p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
