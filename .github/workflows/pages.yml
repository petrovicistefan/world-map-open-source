name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/apps _site/overlays _site/docs _site/.cursor/skills
          cp -R apps/docs apps/demo _site/apps/
          cp -R overlays/* _site/overlays/
          cp -R docs/* _site/docs/ 2>/dev/null || true
          cp README.md CONTRIBUTING.md _site/
          # Docs link to agent skill markdown; include if present
          if [ -d .cursor/skills/add-overlay ]; then
            cp -R .cursor/skills/add-overlay _site/.cursor/skills/
          fi
          # Friendly landing at site root
          cat > _site/index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=apps/docs/" />
    <title>World Map Open Source</title>
    <link rel="canonical" href="apps/docs/" />
  </head>
  <body>
    <p>
      <a href="apps/docs/">Documentation</a> ·
      <a href="apps/demo/">Map demo</a>
    </p>
  </body>
</html>
EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
