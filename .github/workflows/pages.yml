name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/apps _site/overlays _site/docs _site/.cursor/skills
          cp -R apps/docs apps/demo _site/apps/
          cp -R overlays/* _site/overlays/
          mkdir -p _site/assets
          cp -R assets/* _site/assets/ 2>/dev/null || true
          mkdir -p _site/schemas
          cp schemas/taxonomy.json _site/schemas/
          cp -R docs/* _site/docs/ 2>/dev/null || true
          cp README.md CONTRIBUTING.md _site/
          cp apps/pages-root.html _site/index.html
          if [ -d .cursor/skills/add-overlay ]; then
            cp -R .cursor/skills/add-overlay _site/.cursor/skills/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
