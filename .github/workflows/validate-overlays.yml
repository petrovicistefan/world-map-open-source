name: Validate overlays

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Ajv
        run: npm install --no-save ajv@8 ajv-formats@3
      - name: Validate GeoJSON + unique ids
        run: node scripts/validate-overlays.mjs
